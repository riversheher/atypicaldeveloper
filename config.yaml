baseurl: https://www.atypicaldeveloper.com
languageCode: en-ca
theme: hugo-theme-stack
pagination:
  pagerSize: 5
title: A Typical Developer
copyright: River Wang

languages:
    en:
        languageName: English
        title: A Typical Developer
        weight: 1
        params:
            description: Being atypical is only one white space away from being a typical.

DefaultContentLanguage: en

disqusShortname: 
googleAnalytics:

hasCJKLanguage: false

permalinks:
    post: /p/:slug/
    page: /:slug/

params:
    mainSections:
        - post 
    featuredImageField: image
    rssFullContent: true
    favicon:

    footer:
        since: 2023
        customText: 

    dateFormat:
        published: ":date_long"
        lastUpdated: ":date_long :time_long"

    sidebar:
        emoji: "🍥"
        subtitle: "A humble blog about navigating life and work as a typically atypical woman."
        avatar: "img/Frieren_sq.png"

    article:
        math: false
        toc: true
        readingTime: true
        license:
            enabled: false
            default: Licensed under CC BY-NC-SA 4.0

    comments:
        enabled: true
        provider: disqus

        disqusjs:
            shortname:
            apiUrl:
            apiKey:
            admin:
            adminLabel:

    widgets:
        homepage:
            - type: search
            - type: archives
              params:
                  limit: 5
            - type: categories
              params:
                  limit: 10
            - type: tag-cloud
              params:
                  limit: 10
        page:
            - type: toc

    colorScheme:
        # Display toggle
        toggle: true

        # Available values: auto, light, dark
        default: dark

    imageProcessing:
        thumbnail:
            enabled: true
        content:
            enabled: true

menu:
    main:  []

    social:
        - identifier: github
          name: GitHub
          url: https://github.com/riversheher
          params:
              icon: brand-github

        - identifier: linkedin
          name: Linkedin
          url: https://www.linkedin.com/in/river-wang/
          params:
              icon: brand-linkedin